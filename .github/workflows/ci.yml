name: CI

on:
  push:
  pull_request:

permissions:
  contents: read
  # Saving a cache needs more than reading the repository. Restores work with
  # read; writes fail closed without this scope.
  actions: write

jobs:
  verify:
    name: ${{ matrix.os }} verification
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # The registry and compiled dependencies are what make a clean runner slow.
      # Workspace crates stay out of the cache, so a previous run cannot reuse a
      # stale build of this repository. A failed job still saves the dependency
      # cache: the failure is usually a test, not the third-party artifacts.
      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Warn on code health thresholds
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          redline = {"crates/pangu-boundary/src/sandbox.rs", "crates/pangu-agent/src/lib.rs"}
          for path in Path("crates").rglob("*.rs"):
              count = sum(1 for _ in path.open(encoding="utf-8", errors="replace"))
              key = path.as_posix()
              limit = 1500 if key in redline else 2000
              if count > limit:
                  print(f"::warning title=code health::{key} has {count} lines; threshold is {limit}")
          PY

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check workspace
        run: cargo check --workspace --all-targets --all-features

      - name: Run all tests
        shell: bash
        env:
          CARGO_TERM_COLOR: never
        run: |
          # tee keeps the full test output as a downloadable artifact, and the
          # failure summary is re-emitted as ::error:: annotations: the job log
          # needs admin rights and the artifact download needs authentication,
          # but annotations are readable by anyone who can read the repository.
          set +e
          cargo test --workspace --all-targets --all-features 2>&1 | tee all-tests.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            esc() { printf '%s' "$1" | tr -d '\r' | sed -e 's/%/%25/g' -e 's/:/%3A/g'; }
            sed 's/\x1b\[[0-9;]*m//g' all-tests.log > all-tests-plain.log
            {
              grep -aE '^test .* FAILED$' all-tests-plain.log | head -20 || true
              grep -aE '^ +--> ' all-tests-plain.log | head -10 || true
              # The panic message sits on the line after the location and is the
              # part that names the actual refusal, so it must not be dropped.
              grep -aA 3 'panicked at' all-tests-plain.log | grep -avE '^--$' | head -30 || true
            } | while IFS= read -r line; do
              [ -n "$line" ] && echo "::error title=cargo test failure::$(esc "$line")"
            done
            echo "::error title=cargo test failure::exit code $status (full log in the test-log artifact)"
          fi
          exit "$status"

      - name: Run strict Clippy
        shell: bash
        env:
          CARGO_TERM_COLOR: never
        run: |
          # Same reasoning as the test step: the job log needs admin rights, so
          # the diagnostic is re-emitted as an annotation. `grep -a` matters:
          # rustc colourises its output, and without it grep treats the log as
          # binary and silently prints nothing at all.
          set +e
          cargo clippy --workspace --all-targets --all-features -- -D warnings 2>&1 | tee clippy.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            esc() { printf '%s' "$1" | tr -d '\r' | sed -e 's/%/%25/g' -e 's/:/%3A/g'; }
            # Strip ANSI colour before matching: rustc colourises diagnostics and
            # a colourised line does not start with "error", so an anchored
            # match would silently find nothing. `grep -a` then keeps it from
            # treating the log as binary.
            sed 's/\x1b\[[0-9;]*m//g' clippy.log > clippy-plain.log
            {
              grep -aE '^(error|warning)' clippy-plain.log | head -20 || true
              grep -aE '^ +--> ' clippy-plain.log | head -20 || true
              grep -aA 4 '^(error|warning)' clippy-plain.log | grep -avE '^--$' | head -30 || true
            } | while IFS= read -r line; do
              [ -n "$line" ] && echo "::error title=clippy::$(esc "$line")"
            done
            echo "::error title=clippy::exit code $status"
          fi
          exit "$status"

      - name: Archive CI logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-logs-${{ matrix.os }}
          path: |
            all-tests.log
            clippy.log
          if-no-files-found: warn

      - name: Archive all-tests log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-log-${{ matrix.os }}
          path: all-tests.log
          if-no-files-found: warn

      - name: Run F7 checkpoint operator drills
        shell: bash
        env:
          CARGO_TERM_COLOR: never
          PANGU_DRILL_REPORT: ${{ github.workspace }}/f7-drill-report.jsonl
          PANGU_DRILL_COMMIT: ${{ github.sha }}
        run: |
          set +e
          cargo test -p pangu --test operator_drills -- --nocapture 2>&1 | tee drill.log
          status=${PIPESTATUS[0]}
          set -e
          exit "$status"

      # The acceptance record in docs/CHECKPOINT_RECOVERY.md cites these lines.
      # Artifact downloads need authentication, so the report is also emitted
      # as annotations: that keeps the cross-platform evidence reviewable by
      # anyone who can read the repository, not only by the release owner.
      #
      # Severity follows the outcome, and that matters more than it looks.
      # Emitting every line as ::error:: meant a green run carried ~14 error
      # annotations, so "the drills all passed" and "the drills failed" rendered
      # identically 鈥?the signal was only readable by decoding the payload. An
      # alarm that is always on carries no information.
      - name: Publish F7 drill report
        shell: bash
        if: always()
        run: |
          # A workflow command ends at the first newline, and `%`, `:`, `,` and
          # `"` are part of its escape grammar, so the JSON line is escaped
          # before it becomes an annotation message.
          esc() { tr -d '\r' | sed -e 's/%/%25/g' -e 's/:/%3A/g' -e 's/,/%2C/g' -e 's/"/%22/g'; }
          report="${{ github.workspace }}/f7-drill-report.jsonl"
          if [ ! -f "$report" ]; then
            echo "::error title=f7 drill::no drill report was produced on ${{ matrix.os }}"
            exit 0
          fi
          # `outcome` is a fixed vocabulary (docs/evidence/README.md): pass,
          # skipped, not-applicable. Anything else is a malformed report and has
          # to be loud, so it falls through to the error branch.
          while IFS= read -r line; do
            [ -z "$line" ] && continue
            case "$line" in
              *'"outcome":"pass"'*)
                level=notice ;;
              *'"outcome":"skipped"'*|*'"outcome":"not-applicable"'*)
                # Not a pass, and not a failure: the mechanism does not exist or
                # could not be exercised on this platform. Required to stay
                # visible as such so it is never read as coverage.
                level=warning ;;
              *)
                level=error ;;
            esac
            echo "::$level title=f7 drill::$(printf '%s' "$line" | esc)"
          done < "$report"

      - name: Archive F7 drill report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: f7-drill-report-${{ matrix.os }}
          path: f7-drill-report.jsonl
          if-no-files-found: warn

      - name: Install a browser for the real-runtime tests
        # `browser_cdp.rs` drives a real Chromium over CDP; it cannot be verified
        # against a stand-in. Ubuntu runners do not ship a browser, so one is
        # installed explicitly.
        #
        # No `set -e`: a packaging failure here must not fail the job. Whether a
        # browser actually became available is reported by the test step below,
        # which is the only place that knows. Failing here instead would produce a
        # red job whose cause is "apt", not "the browser automation is broken" —
        # a misleading signal, and the kind this repository avoids.
        #
        # `chromium-browser` on recent Ubuntu is a transitional package that
        # installs a snap shim; the snap is unavailable in a container, so the
        # plain `chromium` package is preferred where it exists.
        if: runner.os == 'Linux'
        run: |
          set +e
          sudo apt-get update
          for package in chromium chromium-browser google-chrome-stable; do
            if sudo apt-get install -y --no-install-recommends "$package"; then
              echo "installed: $package"
              break
            fi
            echo "not installable here: $package"
          done
          found=0
          for candidate in /usr/bin/google-chrome /usr/bin/chromium /usr/bin/chromium-browser /snap/bin/chromium; do
            if [ -x "$candidate" ]; then
              # A snap transitional shim exists but does not run; `--version`
              # is what distinguishes a usable browser from a stub that would
              # only fail later, inside a test, for a confusing reason.
              if "$candidate" --version >/dev/null 2>&1; then
                echo "browser usable: $candidate ($("$candidate" --version 2>&1))"
                found=1
              else
                echo "browser present but not runnable: $candidate"
              fi
            fi
          done
          if [ "$found" -eq 0 ]; then
            echo "::warning title=real-runtime tests::no usable browser was installed"
          fi

      - name: Run tests that need a real runtime
        # Some claims cannot be checked by a default `cargo test`: they need a
        # real container runtime or a real browser, so they are `#[ignore]`d and
        # would otherwise never run anywhere. Leaving them unexecuted in CI is
        # how "we have a test for it" quietly becomes "nobody has ever run it".
        #
        # Linux only, deliberately:
        #   * the container runtime is available here (Docker is preinstalled on
        #     ubuntu runners); a Windows runner has no usable Linux engine;
        #   * the symlink/permission tests are `#[cfg(unix)]`, so on Windows they
        #     are not collected at all and "0 failures" would mean "0 ran" —
        #     exactly the misreading this step exists to avoid.
        #
        # A failure here is a real failure. An unavailable runtime is not: the
        # probe reports it and the test asserts the refusal, which is the
        # behaviour that must hold on such a machine.
        if: runner.os == 'Linux'
        shell: bash
        env:
          CARGO_TERM_COLOR: never
        run: |
          set +e
          # Three ignored tests are helper *processes* driven by a parent test
          # (`path_lock_child`, `module_lock_child`,
          # `lock_contention_holder_child`). They return early without their env
          # vars, so running them would add three instant "ok"s that prove
          # nothing and make the count below a worse signal.
          #
          # `--test-threads=1` is required: the browser suite launches nine real
          # Chromium instances, and concurrent launches were measured to leak a
          # profile directory that serial runs do not (see the note at the top of
          # browser_cdp.rs). A leak is quiet — the tests still pass — and only
          # shows up as an unrelated failure in a later run.
          cargo test --workspace --all-targets --all-features -- \
            --ignored \
            --test-threads=1 \
            --skip path_lock_child \
            --skip module_lock_child \
            --skip lock_contention_holder_child \
            2>&1 | tee ignored-tests.log
          status=${PIPESTATUS[0]}
          set -e
          # Report how many actually ran. `cargo test -- --ignored` exits 0 when
          # every ignored test is filtered out, so a passing exit code alone
          # cannot distinguish "they ran" from "there were none".
          ran=$(grep -acE '^test .* \.\.\. ok$' ignored-tests.log || true)
          echo "ignored tests that ran: ${ran:-0}"
          # 11 = 9 browser + 2 container. Fewer means a suite went missing rather
          # than passing, which is the failure this step exists to catch.
          expected=11
          if [ "${ran:-0}" -lt "$expected" ]; then
            echo "::error title=real-runtime tests::only ${ran:-0} of $expected ran; a suite is silently absent"
          else
            echo "::notice title=real-runtime tests::${ran} test(s) ran (real browser + real container)"
          fi
          if [ "$status" -ne 0 ]; then
            esc() { printf '%s' "$1" | tr -d '\r' | sed -e 's/%/%25/g' -e 's/:/%3A/g'; }
            sed 's/\x1b\[[0-9;]*m//g' ignored-tests.log > ignored-tests-plain.log
            grep -aA 3 'panicked at' ignored-tests-plain.log | grep -avE '^--$' | head -30 | while IFS= read -r line; do
              [ -n "$line" ] && echo "::error title=real-runtime test failure::$(esc "$line")"
            done
          fi
          exit "$status"

      - name: Archive real-runtime test log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ignored-tests-log-${{ matrix.os }}
          path: ignored-tests.log
          if-no-files-found: warn

      - name: Run local demo smoke test
        run: cargo run -q -p pangu -- --demo
