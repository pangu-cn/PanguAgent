name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: ${{ matrix.os }} verification
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check workspace
        run: cargo check --workspace --all-targets --all-features

      - name: Run all tests
        shell: bash
        run: |
          # tee keeps the full test output as a downloadable artifact, and the
          # failure summary is re-emitted as ::error:: annotations: the job log
          # needs admin rights and the artifact download needs authentication,
          # but annotations are readable by anyone who can read the repository.
          set +e
          cargo test --workspace --all-targets --all-features 2>&1 | tee all-tests.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            esc() { printf '%s' "$1" | tr -d '\r' | sed -e 's/%/%25/g' -e 's/:/%3A/g'; }
            {
              grep -E '^test .* FAILED$' all-tests.log | head -20 || true
              grep -E '^ +--> ' all-tests.log | head -10 || true
              grep -E 'panicked at' all-tests.log | head -10 || true
            } | while IFS= read -r line; do
              [ -n "$line" ] && echo "::error title=cargo test failure::$(esc "$line")"
            done
            echo "::error title=cargo test failure::exit code $status (full log in the test-log artifact)"
          fi
          exit "$status"

      - name: Archive all-tests log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-log-${{ matrix.os }}
          path: all-tests.log
          if-no-files-found: warn

      - name: Run strict Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Run F7 checkpoint operator drills
        run: cargo test -p pangu --test operator_drills -- --nocapture
        env:
          PANGU_DRILL_REPORT: ${{ github.workspace }}/f7-drill-report.jsonl
          PANGU_DRILL_COMMIT: ${{ github.sha }}

      - name: Archive F7 drill report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: f7-drill-report-${{ matrix.os }}
          path: f7-drill-report.jsonl
          if-no-files-found: warn

      - name: Run local demo smoke test
        run: cargo run -q -p pangu -- --demo
