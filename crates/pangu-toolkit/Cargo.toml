[package]
name = "pangu-toolkit"
description = "Pangu Agent 的工具集合：读/写/搜索/网络工具，带风险分级与沙箱集成"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
async-trait.workspace = true
anyhow.workspace = true
pangu-agent.workspace = true
pangu-boundary.workspace = true
pangu-core.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio.workspace = true
tracing.workspace = true
url.workspace = true

[dev-dependencies]
# The MCP client tests drive a real server subprocess, so they need the
# multi-threaded runtime and the test macro rather than just the sync subset the
# library uses.
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }

# A test fixture, not a product binary: the MCP client tests need a server whose
# stdout is exclusively the JSON-RPC stream. The cargo test harness writes to
# stdout, so the fixture must be a real [[bin]] target.
[[bin]]
name = "mcp_fixture_server"
path = "src/bin/mcp_fixture_server.rs"
# It is only ever built for tests; `cargo install` must not ship it.
required-features = []
test = false
doctest = false
